# LOCAL PostgreSQL profile
spring.config.activate.on-profile=local-db
spring.datasource.url=${DB_LOCAL_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_LOCAL_USERNAME:postgres}
spring.datasource.password=${DB_LOCAL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Human-readable target shown in startup/config diagnostics.
app.database.target=LOCAL PostgreSQL (postgres@localhost:5432)
