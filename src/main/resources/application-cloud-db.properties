# COCKROACHDB Cloud profile
spring.config.activate.on-profile=cloud-db
spring.datasource.url=${DB_CLOUD_URL}
spring.datasource.username=${DB_CLOUD_USERNAME}
spring.datasource.password=${DB_CLOUD_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Human-readable target shown in startup/config diagnostics.
app.database.target=COCKROACHDB Cloud (defaultdb)
